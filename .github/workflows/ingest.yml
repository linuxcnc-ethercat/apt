---
name: Ingest release

on:
    repository_dispatch:
        types: [ingest-release]
    workflow_dispatch:
        inputs:
            source_repo:
                description: 'owner/repo of the source project'
                required: true
                type: string
            tag:
                description: 'release tag to pull .debs from'
                required: false
                type: string
            run_id:
                description: 'CI run id to pull .deb artifacts from (instead of a release)'
                required: false
                type: string
            artifact_pattern:
                description: 'artifact name glob for run_id ingestion (e.g. *-arm64); empty = all artifacts'
                required: false
                type: string

permissions:
    contents: write

# Serialize ingest runs so the git push at the end of each can't race
# another job. cancel-in-progress=false to ensure no release is dropped.
concurrency:
    group: apt-ingest
    cancel-in-progress: false

jobs:
    ingest:
        runs-on: ubuntu-latest
        env:
            SOURCE_REPO: ${{ github.event.client_payload.source_repo || inputs.source_repo }}
            RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
            RUN_ID: ${{ inputs.run_id || '' }}
            ARTIFACT_PATTERN: ${{ inputs.artifact_pattern || '' }}
        steps:
            - name: Checkout apt repo
              uses: actions/checkout@v4

            - name: Install reprepro and gpg
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends reprepro gpg

            - name: Import signing key
              env:
                  PRIV: ${{ secrets.APT_GPG_PRIVATE_KEY }}
              run: |
                  echo "$PRIV" | gpg --batch --import
                  echo "trust-model always" >> ~/.gnupg/gpg.conf

            - name: Rebuild reprepro db from pool
              run: |
                  # reprepro's berkeley-db state lives under db/. If something
                  # corrupts or drops it (or if a .deb landed in pool/ without
                  # an includedeb call), the per-codename Packages files lose
                  # entries even though the .deb is still on disk. Rebuild the
                  # index from the pool on every run so dists/ always reflects
                  # the full pool content.
                  set -e
                  shopt -s nullglob
                  rm -rf db dists
                  mkdir -p db
                  for d in pool/main/*/*/*.deb; do
                      ver=$(dpkg-deb -f "$d" Version)
                      case "$ver" in
                          *+deb11u*) codename=bullseye ;;
                          *+deb12u*) codename=bookworm ;;
                          *+deb13u*) codename=trixie   ;;
                          *)
                              echo "skip $d: version '$ver' has no codename suffix"
                              continue
                              ;;
                      esac
                      reprepro -b . --keepunreferencedfiles includedeb "$codename" "$d"
                  done

            - name: Check release type
              id: check
              if: env.RUN_ID == ''
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  is_pre=$(gh release view "$RELEASE_TAG" \
                      --repo "$SOURCE_REPO" \
                      --json isPrerelease -q .isPrerelease)
                  echo "isPrerelease=$is_pre"
                  echo "is_prerelease=$is_pre" >> "$GITHUB_OUTPUT"
                  if [ "$is_pre" = "true" ]; then
                      echo "::notice::skipping pre-release ${SOURCE_REPO}@${RELEASE_TAG}"
                  fi

            - name: Download release .debs
              if: env.RUN_ID == '' && steps.check.outputs.is_prerelease != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p incoming
                  gh release download "$RELEASE_TAG" \
                      --repo "$SOURCE_REPO" \
                      --pattern '*.deb' \
                      --dir incoming
                  ls -la incoming

            - name: Download CI run .deb artifacts
              if: env.RUN_ID != ''
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p incoming
                  args=(--repo "$SOURCE_REPO" --dir incoming)
                  if [ -n "$ARTIFACT_PATTERN" ]; then
                      args+=(--pattern "$ARTIFACT_PATTERN")
                  fi
                  gh run download "$RUN_ID" "${args[@]}"
                  # gh extracts each artifact into its own subdirectory;
                  # flatten so the codename routing step sees one dir of debs.
                  find incoming -mindepth 2 -name '*.deb' -exec mv -t incoming {} +
                  ls -la incoming

            - name: Add .debs to reprepro per codename
              if: steps.check.outputs.is_prerelease != 'true'
              run: |
                  set -e
                  shopt -s nullglob
                  # Route each .deb to a codename by parsing its Version field:
                  # the source build stamps "+debNNuM" (e.g. +deb12u1) on every
                  # binary so a single GH release can carry artifacts for all
                  # supported distros without filename collisions.
                  for d in incoming/*.deb; do
                      ver=$(dpkg-deb -f "$d" Version)
                      case "$ver" in
                          *+deb11u*) codename=bullseye ;;
                          *+deb12u*) codename=bookworm ;;
                          *+deb13u*) codename=trixie   ;;
                          *)
                              echo "skip $d: version '$ver' has no codename suffix"
                              continue
                              ;;
                      esac
                      reprepro -b . --keepunreferencedfiles includedeb "$codename" "$d"
                  done

            - name: Commit pool/dists updates
              if: steps.check.outputs.is_prerelease != 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add pool dists
                  if git diff --cached --quiet; then
                      echo "no changes to commit"
                      exit 0
                  fi
                  git commit -m "ingest ${SOURCE_REPO}@${RELEASE_TAG}${RUN_ID:+ (run ${RUN_ID})}"
                  # Defense in depth: concurrency above should prevent races,
                  # but if a manual run or queued dispatch slipped through,
                  # rebase onto remote main before pushing.
                  for i in 1 2 3; do
                      if git push; then break; fi
                      echo "push rejected; rebasing on origin/main (attempt $i)"
                      git pull --rebase origin main
                  done
